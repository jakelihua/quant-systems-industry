<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨机构量化岗位索引</title>
<style>
:root{color-scheme:light;--paper:#f2f4ed;--card:#fffdf7;--ink:#182b25;--muted:#4d625a;--line:#d8e2d9;--accent:#145842}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1250px;margin:auto;padding:38px 28px 60px}header{padding:15px 0 19px;border-bottom:1px solid #9ab2a1}
h1{font-size:clamp(30px,5vw,58px);line-height:1.14;margin:7px 0 14px;letter-spacing:-.04em}p{margin:8px 0}.muted{color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:21px 0 10px}.controls label{display:grid;gap:4px;font-weight:650}input,select,button{font:inherit;color:var(--ink);background:var(--card);padding:7px 10px;border:1px solid #9ab2a1;border-radius:6px}button{cursor:pointer}button:hover{background:#e4eee5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.scroll{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}table{width:100%;min-width:810px;border-collapse:collapse}td,th{text-align:left;vertical-align:top;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}th{background:#e4eee4;font-size:14px}td:first-child{font-weight:650}td:nth-child(2){max-width:210px}td:nth-child(5){min-width:250px}
a{color:var(--accent);text-underline-offset:.15em}[hidden]{display:none}@media(max-width:650px){main{padding:14px 12px 30px}}
</style></head><body><main>
<header><p class="muted">2026-11-22 · 公开招聘证据</p>
<h1>跨机构量化岗位索引</h1>
<p>按机构、岗位族和证据类型查看岗位原文。具名岗位、公司披露方向和证据待补线索各自显示。</p>
<p class="muted" id="summary">__SUMMARY__</p></header>
<div class="controls">
<label for="query">搜索岗位或技术<input id="query" type="search" placeholder="例如 期权、Kafka、智能化"></label>
<label for="org">机构<select id="org"><option value="">全部</option>__ORGS__</select></label>
<label for="family">岗位族<select id="family"><option value="">全部</option>__FAMILIES__</select></label>
<label for="kind">证据类型<select id="kind"><option value="">全部</option><option>具名岗位</option><option>方向</option><option>线索</option></select></label>
<button id="reset" type="button">清空筛选</button>
</div>
<p id="count" role="status"></p>
<div class="scroll" tabindex="0" aria-label="岗位证据表，可横向滚动">
<table><thead><tr><th>机构</th><th>岗位或方向</th><th>岗位族</th><th>证据</th><th>公开职责或技术摘要</th><th>来源与状态</th></tr></thead>
<tbody>__ROWS__</tbody></table></div>
<p class="muted">摘要的颗粒度随来源变化。招聘状态请以原页为准，历史样本保留时间标记。</p>
</main><script>
const ids=["query","org","family","kind"];
const fields=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const rows=Array.from(document.querySelectorAll("tbody tr")).map(row=>[row,row.textContent.toLowerCase()]);
const counter=document.getElementById("count");
function update(){
 const search=fields.query.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
 let hits=0;
 for(const [row,content] of rows){
   const matchesText=search.every(word=>content.includes(word));
   const matchesSelect=["org","family","kind"].every(key=>!fields[key].value||row.dataset[key]===fields[key].value);
   row.hidden=!(matchesText&&matchesSelect);
   if(!row.hidden) hits++;
 }
 counter.textContent=hits ? `显示 ${hits} / ${rows.length} 条记录` : "没有符合筛选条件的记录";
}
for(const field of Object.values(fields)){field.addEventListener(field.type==="search"?"input":"change",update);}
document.getElementById("reset").addEventListener("click",()=>{
 for(const field of Object.values(fields))field.value="";
 update();
 fields.query.focus();
});
update();
</script></body></html>
